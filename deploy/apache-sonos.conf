# Reverse-proxy the Sonos dashboard (Flask on 127.0.0.1:8001) at /sonos/.
#
# Install as a global drop-in (applies to the existing site on :80 without
# editing 000-default.conf):
#
#     sudo a2enmod proxy proxy_http
#     sudo cp deploy/apache-sonos.conf /etc/apache2/conf-available/sonos.conf
#     sudo a2enconf sonos
#     sudo apache2ctl configtest
#     sudo systemctl reload apache2
#
# The Flask app renders relative URLs and inlines its CSS/JS, so it works
# correctly under the /sonos/ prefix. The trailing slashes below matter.

ProxyPreserveHost On

# Send visitors who type /sonos (no trailing slash) to /sonos/.
RedirectMatch permanent ^/sonos$ /sonos/

ProxyPass        /sonos/ http://127.0.0.1:8001/
ProxyPassReverse /sonos/ http://127.0.0.1:8001/
